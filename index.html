<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073b4c">
  <title>Coast Guardians</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 16px; display: grid; place-items: center; background: #073b4c; font-family: Arial, sans-serif; }
    #jogo { width: min(800px, calc(100vw - 32px)); }
    #jogo canvas { display: block; max-width: 100%; height: auto !important; }
    .visualmente-oculto { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main id="jogo" aria-label="Jogo Coast Guardians">
    <h1 class="visualmente-oculto">Coast Guardians</h1>
  </main>

  <!-- p5.sound tem de ser carregado depois do p5.js. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>

  <!-- Carregar as classes antes do ponto de entrada. -->
  <script src="src/Collectible.js"></script>
  <script src="src/AudioController.js"></script>
  <script src="src/Game.js"></script>
  <script src="src/sketch.js"></script>
</body>
</html>
